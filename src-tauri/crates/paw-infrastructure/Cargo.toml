[package]
name = "paw-infrastructure"
description = "SQLite persistence, migrations, filesystem, credential store, and external adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paw-application = { path = "../paw-application" }
paw-domain = { path = "../paw-domain" }

# SQLite driver + content checksum (E1-03) + online backup API (E1-06)
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
sha2 = "0.10"
thiserror = "1"
# Outbox/Operation IDs (E1-07/08 Tier 1: generated inside the persistence
# service until the application coordination layer owns ID minting)
uuid = { version = "1", features = ["v7"] }
serde_json = "1"
