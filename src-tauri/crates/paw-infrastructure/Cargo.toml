[package]
name = "paw-infrastructure"
description = "SQLite persistence, migrations, filesystem, credential store, and external adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paw-application = { path = "../paw-application" }
paw-domain = { path = "../paw-domain" }

# SQLite driver + content checksum (E1-03) + online backup API (E1-06)
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
sha2 = "0.10"
thiserror = "1"
